# Include once from the reverse proxy's http context. The edge network is private.
limit_req_zone $binary_remote_addr zone=saipport_requests:1m rate=8r/s;
limit_req_zone $binary_remote_addr zone=saipport_sessions:1m rate=2r/m;
limit_req_zone $binary_remote_addr zone=saipport_runs:1m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=saipport_connections:1m;

server {
    listen 80;
    listen [::]:80;
    server_name saipport.gulevskii.dev;
    location ^~ /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name saipport.gulevskii.dev;
    ssl_certificate /etc/letsencrypt/live/saipport.gulevskii.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saipport.gulevskii.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 64k;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn saipport_connections 16;
    access_log /data/logs/saipport_access.log combined;
    error_log /data/logs/saipport_error.log warn;

    location = /api/demo/session {
        limit_req zone=saipport_sessions burst=5 nodelay;
        include /data/saipport/upstream.conf;
    }
    location ~ ^/api/tickets/[^/]+/runs$ {
        limit_req zone=saipport_runs burst=5 nodelay;
        include /data/saipport/upstream.conf;
    }
    location / {
        limit_req zone=saipport_requests burst=40 nodelay;
        include /data/saipport/upstream.conf;
    }
}
